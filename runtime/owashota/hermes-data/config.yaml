model:
  provider: opencode-go
  model: moonshotai/kimi-k2.6
  base_url: https://opencode.ai/zen/go/v1
  api_mode: chat_completions

toolsets:
  - hermes-cli

agent:
  max_turns: 60
  gateway_timeout: 1800
  api_max_retries: 3
  reasoning_effort: medium

terminal:
  backend: local
  cwd: /workspace
  timeout: 180
  env_passthrough: []

approvals:
  mode: manual
  timeout: 60

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: openviking

tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
