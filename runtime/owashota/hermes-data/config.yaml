model:
  provider: opencode-go
  base_url: https://opencode.ai/zen/go/v1
  api_mode: chat_completions
  default: deepseek-v4-flash
toolsets: '["hermes-discord"]'
agent:
  max_turns: 60
  gateway_timeout: 1800
  api_max_retries: 3
  verify_on_stop: false
  reasoning_effort: medium
session_reset:
  mode: idle
  idle_minutes: 1440
  at_hour: 4
terminal:
  backend: local
  cwd: /workspace
  timeout: 180
  env_passthrough: []
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
display:
  tool_progress: all
memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: openviking
approvals:
  mode: manual
  timeout: 60
command_allowlist:
  - script execution via -e/-c flag
web:
  search_backend: searxng
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
_config_version: 33
plugins:
  enabled: []
stt:
  enabled: true
  provider: local
  local:
    model: small
    python_path: /opt/data/.venv-tools/bin/python
tts:
  provider: edge
  edge:
    voice: ja-JP-NanamiNeural
voice:
  silence_threshold: 200
  silence_duration: 3.0
auxiliary:
  vision:
    provider: opencode-go
    model: mimo-v2.5
    base_url: ''
    api_key: ''
    timeout: 120
    extra_body: {}
    download_timeout: 30
