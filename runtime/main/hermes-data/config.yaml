model:
  provider: openai-codex
  default: gpt-5.6-sol
toolsets:
  - hermes-cli
agent:
  max_turns: 90
  gateway_timeout: 1800
  api_max_retries: 3
  reasoning_effort: medium
  verify_on_stop: false
auxiliary:
  web_extract:
    provider: opencode-go
    model: deepseek-v4-flash
  compression:
    provider: opencode-go
    model: deepseek-v4-flash
  session_search:
    provider: opencode-go
    model: deepseek-v4-flash
  skills_hub:
    provider: opencode-go
    model: deepseek-v4-flash
  approval:
    provider: opencode-go
    model: deepseek-v4-flash
  mcp:
    provider: opencode-go
    model: deepseek-v4-flash
  title_generation:
    provider: opencode-go
    model: deepseek-v4-flash
  curator:
    provider: opencode-go
    model: deepseek-v4-flash
session_reset:
  mode: idle
  idle_minutes: 1440
  at_hour: 4
terminal:
  backend: local
  cwd: /workspace
  timeout: 180
  env_passthrough: []
approvals:
  mode: manual
  timeout: 60
memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: openviking
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
display:
  tool_progress: all
web:
  search_backend: searxng
plugins:
  enabled: []
_config_version: 33
onboarding:
  seen:
    busy_input_prompt: true
