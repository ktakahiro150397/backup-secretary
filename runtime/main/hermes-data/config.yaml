model:
  model: moonshotai/kimi-k2.6
  base_url: https://opencode.ai/zen/go/v1
  default: kimi-k2.6
  provider: opencode-go
  api_mode: chat_completions

toolsets:
  - hermes-cli

agent:
  max_turns: 90
  gateway_timeout: 1800
  api_max_retries: 3
  reasoning_effort: medium

terminal:
  backend: local
  cwd: /workspace
  timeout: 180
  env_passthrough: []
  persistent_shell: true

approvals:
  mode: manual
  timeout: 60

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: openviking

tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000

browser:
  allow_private_urls: false
  auto_local_for_private_urls: true

display:
  compact: false
  personality: concise
  streaming: true
  interim_assistant_messages: true
  final_response_markdown: strip
  inline_diffs: true
  show_cost: false
  runtime_footer:
    enabled: false
