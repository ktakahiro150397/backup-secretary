{
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "root_api_key": "$OPENVIKING_ROOT_API_KEY",
    "cors_origins": [
      "*"
    ]
  },
  "storage": {
    "workspace": "/app/.openviking/workspace"
  },
  "embedding": {
    "allow_metadata_override": true,
    "dense": {
      "provider": "openai",
      "model": "google/gemini-embedding-2-preview",
      "api_key": "${OPENROUTER_API_KEY}",
      "api_base": "https://openrouter.ai/api/v1",
      "dimension": 3072,
      "encoding_format": "float"
    }
  },
  "auto_generate_l0": false,
  "auto_generate_l1": false,
  "default_search_mode": "thinking",
  "default_search_limit": 3,
  "log": {
    "level": "WARN",
    "format": "%(asctime)s - %(name)s - %(levelname)s - %(message)s",
    "output": "stdout",
    "rotation": false
  },
  "vlm": {
    "provider": "litellm",
    "model": "openai/mimo-v2.5",
    "api_key": "${OPENCODE_GO_API_KEY}",
    "api_base": "https://opencode.ai/zen/go/v1",
    "extra_headers": {
      "x-opencode-session": "openviking-yanelmoserver",
      "User-Agent": "backup-secretary-openviking/1.0"
    },
    "temperature": 0.0,
    "max_retries": 3
  }
}
