name: backup-secretary

x-hermes-build: &hermes-build
  context: .
  dockerfile: docker/hermes/Dockerfile
  args:
    HERMES_BASE_IMAGE: ${HERMES_BASE_IMAGE:-nousresearch/hermes-agent:latest}
    HERMES_UID: ${HERMES_UID:-1000}
    HERMES_GID: ${HERMES_GID:-1000}

x-hermes-common: &hermes-common
  image: ${HERMES_IMAGE:-backup-secretary/hermes-agent:local}
  build: *hermes-build
  restart: unless-stopped
  environment:
    HERMES_HOME: /opt/data
    HOME: /opt/data
    HERMES_EXEC_ASK: "1"
    SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  networks:
    - hermes-net
  read_only: ${HERMES_READ_ONLY:-false}
  tmpfs:
    - /tmp:rw,nosuid,size=512m
    - /var/tmp:rw,noexec,nosuid,size=256m
    - /run:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  hermes-main:
    <<: *hermes-common
    container_name: backup-secretary-hermes-main
    command: gateway run
    environment:
      HERMES_HOME: /opt/data
      HOME: /opt/data
      HERMES_EXEC_ASK: "1"
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      OPENVIKING_ENDPOINT: http://openviking:1933
      OPENVIKING_ACCOUNT: ${OPENVIKING_ACCOUNT:-personal}
      OPENVIKING_USER: ${OPENVIKING_USER:-yanelmo}
      OPENVIKING_AGENT: ${OPENVIKING_MAIN_AGENT:-hermes-main}
      OPENVIKING_API_KEY: ${OPENVIKING_API_KEY:-}
    volumes:
      - type: bind
        source: ${HERMES_MAIN_DATA_DIR:-./runtime/main/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace
      - type: bind
        source: ${HERMES_MANAGED_SKILLS_DIR:-./skills}
        target: /managed-skills
        read_only: true
    ports:
      - "${HERMES_MAIN_GATEWAY_BIND:-127.0.0.1}:${HERMES_MAIN_GATEWAY_PORT:-8642}:8642"
    depends_on:
      - openviking
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'hermes gateway run' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${HERMES_MAIN_MEMORY_LIMIT:-4g}
    cpus: ${HERMES_MAIN_CPU_LIMIT:-2}
    shm_size: ${HERMES_MAIN_SHM_SIZE:-1g}

  hermes-owashota:
    <<: *hermes-common
    container_name: backup-secretary-hermes-owashota
    command: gateway run
    volumes:
      - type: bind
        source: ${HERMES_OWASHOTA_DATA_DIR:-./runtime/owashota/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace
      - type: bind
        source: ${HERMES_MANAGED_SKILLS_DIR:-./skills}
        target: /managed-skills
        read_only: true
    ports:
      - "${HERMES_OWASHOTA_GATEWAY_BIND:-127.0.0.1}:${HERMES_OWASHOTA_GATEWAY_PORT:-8643}:8642"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'hermes gateway run' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${HERMES_OWASHOTA_MEMORY_LIMIT:-2g}
    cpus: ${HERMES_OWASHOTA_CPU_LIMIT:-1}
    shm_size: ${HERMES_OWASHOTA_SHM_SIZE:-512m}

  openviking:
    build:
      context: ${OPENVIKING_BUILD_CONTEXT:-https://github.com/volcengine/OpenViking.git#main}
      dockerfile: Dockerfile
    container_name: backup-secretary-openviking
    restart: unless-stopped
    environment:
      OPENVIKING_WITH_BOT: ${OPENVIKING_WITH_BOT:-0}
    volumes:
      - type: bind
        source: ${OPENVIKING_DATA_DIR:-./runtime/openviking}
        target: /app/.openviking
    ports:
      - "${OPENVIKING_BIND:-127.0.0.1}:${OPENVIKING_PORT:-1933}:1933"
    networks:
      - hermes-net
    mem_limit: ${OPENVIKING_MEMORY_LIMIT:-2g}
    cpus: ${OPENVIKING_CPU_LIMIT:-1}

  dashboard-main:
    <<: *hermes-common
    container_name: backup-secretary-hermes-dashboard-main
    command: dashboard --host 0.0.0.0 --insecure
    profiles:
      - dashboard
    volumes:
      - type: bind
        source: ${HERMES_MAIN_DATA_DIR:-./runtime/main/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace
      - type: bind
        source: ${HERMES_MANAGED_SKILLS_DIR:-./skills}
        target: /managed-skills
        read_only: true
    ports:
      - "${HERMES_DASHBOARD_BIND:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-9119}:9119"
    environment:
      HERMES_HOME: /opt/data
      HOME: /opt/data
      GATEWAY_HEALTH_URL: http://hermes-main:8642
      GATEWAY_HEALTH_TIMEOUT: ${GATEWAY_HEALTH_TIMEOUT:-3}
    depends_on:
      - hermes-main
    mem_limit: ${HERMES_DASHBOARD_MEMORY_LIMIT:-512m}
    cpus: ${HERMES_DASHBOARD_CPU_LIMIT:-0.5}

  setup-main:
    <<: *hermes-common
    container_name: backup-secretary-hermes-setup-main
    command: setup
    profiles:
      - setup
    restart: "no"
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ${HERMES_MAIN_DATA_DIR:-./runtime/main/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace
      - type: bind
        source: ${HERMES_MANAGED_SKILLS_DIR:-./skills}
        target: /managed-skills
        read_only: true

  setup-owashota:
    <<: *hermes-common
    container_name: backup-secretary-hermes-setup-owashota
    command: setup
    profiles:
      - setup
    restart: "no"
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ${HERMES_OWASHOTA_DATA_DIR:-./runtime/owashota/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace
      - type: bind
        source: ${HERMES_MANAGED_SKILLS_DIR:-./skills}
        target: /managed-skills
        read_only: true

  skills-sync-main:
    <<: *hermes-common
    container_name: backup-secretary-hermes-skills-sync-main
    command: bash -lc "mkdir -p /opt/data/skills && rsync -a /managed-skills/ /opt/data/skills/"
    profiles:
      - skills-sync
    restart: "no"
    volumes:
      - type: bind
        source: ${HERMES_MAIN_DATA_DIR:-./runtime/main/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_MANAGED_SKILLS_DIR:-./skills}
        target: /managed-skills
        read_only: true

  skills-sync-owashota:
    <<: *hermes-common
    container_name: backup-secretary-hermes-skills-sync-owashota
    command: bash -lc "mkdir -p /opt/data/skills && rsync -a /managed-skills/ /opt/data/skills/"
    profiles:
      - skills-sync
    restart: "no"
    volumes:
      - type: bind
        source: ${HERMES_OWASHOTA_DATA_DIR:-./runtime/owashota/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_MANAGED_SKILLS_DIR:-./skills}
        target: /managed-skills
        read_only: true

  cli-main:
    <<: *hermes-common
    container_name: backup-secretary-hermes-cli-main
    command: bash
    profiles:
      - cli
    restart: "no"
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ${HERMES_MAIN_DATA_DIR:-./runtime/main/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace
      - type: bind
        source: ${HERMES_MANAGED_SKILLS_DIR:-./skills}
        target: /managed-skills
        read_only: true

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: backup-secretary-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND:-127.0.0.1}:${SEARXNG_PORT:-8080}:8080"
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080/}
    volumes:
      - type: bind
        source: ${SEARXNG_CONFIG_DIR:-./config/searxng}
        target: /etc/searxng
        read_only: true
    networks:
      - hermes-net
    depends_on:
      - redis
    mem_limit: ${SEARXNG_MEMORY_LIMIT:-512m}
    cpus: ${SEARXNG_CPU_LIMIT:-0.5}

  redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: backup-secretary-searxng-redis
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - type: volume
        source: searxng_redis_data
        target: /data
    networks:
      - hermes-net
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}

networks:
  hermes-net:
    driver: bridge

volumes:
  searxng_redis_data:
