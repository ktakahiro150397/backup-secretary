name: backup-secretary

x-hermes-common: &hermes-common
  image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
  user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
  restart: unless-stopped
  environment:
    HERMES_HOME: /opt/data
    HOME: /opt/data
  volumes:
    - type: bind
      source: ${HERMES_WORKSPACE_DIR:-./workspace}
      target: /workspace
  networks:
    - hermes-net

services:
  hermes-main:
    <<: *hermes-common
    container_name: backup-secretary-hermes-main
    command: gateway run
    env_file:
      - ${HERMES_MAIN_ENV_FILE:-./runtime/main/hermes-data/.env}
    environment:
      HERMES_HOME: /opt/data
      HOME: /opt/data
      OPENVIKING_ENDPOINT: http://openviking:1933
    volumes:
      - type: bind
        source: ${HERMES_MAIN_DATA_DIR:-./runtime/main/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace
    ports:
      - "${HERMES_MAIN_GATEWAY_BIND:-127.0.0.1}:${HERMES_MAIN_GATEWAY_PORT:-8642}:8642"
    depends_on:
      - openviking

  hermes-owashota:
    <<: *hermes-common
    container_name: backup-secretary-hermes-owashota
    command: gateway run
    env_file:
      - ${HERMES_OWASHOTA_ENV_FILE:-./runtime/owashota/hermes-data/.env}
    environment:
      HERMES_HOME: /opt/data
      HOME: /opt/data
      OPENVIKING_ENDPOINT: http://openviking:1933
    volumes:
      - type: bind
        source: ${HERMES_OWASHOTA_DATA_DIR:-./runtime/owashota/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace
    ports:
      - "${HERMES_OWASHOTA_GATEWAY_BIND:-127.0.0.1}:${HERMES_OWASHOTA_GATEWAY_PORT:-8643}:8642"
    depends_on:
      - openviking

  openviking:
    image: ${OPENVIKING_IMAGE:-ghcr.io/volcengine/openviking:latest}
    container_name: backup-secretary-openviking
    restart: unless-stopped
    environment:
      OPENVIKING_WITH_BOT: ${OPENVIKING_WITH_BOT:-0}
    volumes:
      - type: bind
        source: ${OPENVIKING_DATA_DIR:-./runtime/openviking}
        target: /app/.openviking
    ports:
      - "${OPENVIKING_BIND:-127.0.0.1}:${OPENVIKING_PORT:-1933}:1933"
    networks:
      - hermes-net

  setup-main:
    <<: *hermes-common
    container_name: backup-secretary-hermes-setup-main
    command: setup
    profiles:
      - setup
    restart: "no"
    stdin_open: true
    tty: true
    env_file:
      - ${HERMES_MAIN_ENV_FILE:-./runtime/main/hermes-data/.env}
    volumes:
      - type: bind
        source: ${HERMES_MAIN_DATA_DIR:-./runtime/main/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace

  setup-owashota:
    <<: *hermes-common
    container_name: backup-secretary-hermes-setup-owashota
    command: setup
    profiles:
      - setup
    restart: "no"
    stdin_open: true
    tty: true
    env_file:
      - ${HERMES_OWASHOTA_ENV_FILE:-./runtime/owashota/hermes-data/.env}
    volumes:
      - type: bind
        source: ${HERMES_OWASHOTA_DATA_DIR:-./runtime/owashota/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace

networks:
  hermes-net:
    driver: bridge
