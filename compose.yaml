name: backup-secretary-hermes

x-hermes-otel-env: &hermes-otel-env
  HERMES_OTEL_ENABLED: "true"
  HERMES_OTEL_CAPTURE_PREVIEWS: "false"
  HERMES_OTEL_CAPTURE_CONVERSATION_HISTORY: "false"
  HERMES_OTEL_CAPTURE_FULL_PROMPTS: "false"
  HERMES_OTEL_CAPTURE_FULL_RESPONSES: "false"
  HERMES_OTEL_CAPTURE_SENDER_ID: "true"
  HERMES_OTEL_CAPTURE_LOGS: "false"
  HERMES_OTEL_DASHBOARD_LIVE: "false"
  HERMES_OTEL_FORCE_FLUSH_ON_SESSION_END: "false"
  HERMES_OTEL_SPAN_BATCH_EXPORT_TIMEOUT_MS: "3000"
  HERMES_OTEL_DEBUG: "false"

x-hermes-common: &hermes-common
  image: ${HERMES_IMAGE:-backup-secretary/hermes-agent:local}
  build:
    context: ./docker/hermes
    dockerfile: Dockerfile
    args:
      HERMES_BASE_IMAGE: ${HERMES_BASE_IMAGE:-nousresearch/hermes-agent@sha256:00f57d79b2b20745a4f2c47bd26135f0473100ca23103ffc3eb3f89f3f6cef50}
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_OTEL_REF: ${HERMES_OTEL_REF:-0180c5e63b9d035ee0754d9a0d75c3499a8def26}
      OTEL_PYTHON_VERSION: ${OTEL_PYTHON_VERSION:-1.44.0}
      PYYAML_VERSION: ${PYYAML_VERSION:-6.0.3}
  restart: unless-stopped
  environment:
    <<: *hermes-otel-env
    HERMES_HOME: /opt/data
    HOME: /opt/data
    HERMES_EXEC_ASK: "1"
    SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  volumes:
    - type: bind
      source: ${HERMES_DATA_DIR:-~/repo/backup-secretary-data/main/hermes-data} # メインhermesデータディレクトリを指定
      target: /opt/data
    - type: bind
      source: ${HERMES_WORKSPACE_DIR:-./workspace}
      target: /workspace
    - type: bind
      source: ${HERMES_MANAGED_SKILLS_DIR:-./skills}
      target: /managed-skills
      read_only: true
    - type: bind
      source: ./observability/hermes-otel/main.yaml
      target: /opt/data/.hermes/plugins/hermes_otel/config.yaml
      read_only: true
  networks:
    - hermes-net
  read_only: ${HERMES_READ_ONLY:-false}
  tmpfs:
    - /tmp:rw,nosuid,size=512m
    - /var/tmp:rw,noexec,nosuid,size=256m
    - /run:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: ${HERMES_MEMORY_LIMIT:-4g}
  cpus: ${HERMES_CPU_LIMIT:-2}
  shm_size: ${HERMES_SHM_SIZE:-1g}

services:
  hermes:
    <<: *hermes-common
    container_name: ${HERMES_CONTAINER_NAME:-backup-secretary-hermes}
    command: gateway run
    networks:
      - hermes-net
      - local-observability-net
    ports:
      - "${HERMES_GATEWAY_BIND:-127.0.0.1}:${HERMES_GATEWAY_PORT:-8642}:8642"
    healthcheck:
      test:
        - CMD-SHELL
        - "pgrep -f 'hermes gateway run' >/dev/null"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard:
    <<: *hermes-common
    container_name: ${HERMES_DASHBOARD_CONTAINER_NAME:-backup-secretary-hermes-dashboard}
    command: dashboard --host 0.0.0.0 --insecure
    profiles:
      - dashboard
    ports:
      - "${HERMES_DASHBOARD_BIND:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-9119}:9119"
    environment:
      <<: *hermes-otel-env
      HERMES_HOME: /opt/data
      HOME: /opt/data
      GATEWAY_HEALTH_URL: http://hermes:8642
      GATEWAY_HEALTH_TIMEOUT: ${GATEWAY_HEALTH_TIMEOUT:-3}
    depends_on:
      - hermes
    mem_limit: ${HERMES_DASHBOARD_MEMORY_LIMIT:-512m}
    cpus: ${HERMES_DASHBOARD_CPU_LIMIT:-0.5}

  setup:
    <<: *hermes-common
    container_name: ${HERMES_SETUP_CONTAINER_NAME:-backup-secretary-hermes-setup}
    command: setup
    profiles:
      - setup
    restart: "no"
    stdin_open: true
    tty: true

  skills-sync:
    <<: *hermes-common
    container_name: ${HERMES_SKILLS_SYNC_CONTAINER_NAME:-backup-secretary-hermes-skills-sync}
    command: bash -lc "mkdir -p /opt/data/skills && rsync -a /managed-skills/ /opt/data/skills/"
    profiles:
      - skills-sync
    restart: "no"

  cli:
    <<: *hermes-common
    container_name: ${HERMES_CLI_CONTAINER_NAME:-backup-secretary-hermes-cli}
    command: bash
    profiles:
      - cli
    restart: "no"
    stdin_open: true
    tty: true

  hermes-owashota:
    <<: *hermes-common
    container_name: ${HERMES_OWASHOTA_CONTAINER_NAME:-backup-secretary-hermes-owashota}
    command: gateway run
    environment:
      <<: *hermes-otel-env
      HERMES_HOME: /opt/data
      HOME: /opt/data
      HERMES_EXEC_ASK: "1"
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    volumes:
      - type: bind
        source: ${HERMES_OWASHOTA_DATA_DIR:-${HOME}/repo/backup-secretary-data/owashota/hermes-data}
        target: /opt/data
      - type: bind
        source: ${HERMES_WORKSPACE_DIR:-./workspace}
        target: /workspace
      - type: bind
        source: ${HERMES_MANAGED_SKILLS_DIR:-./skills}
        target: /managed-skills
        read_only: true
      - type: bind
        source: ./observability/hermes-otel/owashota.yaml
        target: /opt/data/.hermes/plugins/hermes_otel/config.yaml
        read_only: true
    networks:
      - hermes-net
      - local-observability-net
    ports:
      - "${HERMES_OWASHOTA_GATEWAY_BIND:-127.0.0.1}:${HERMES_OWASHOTA_GATEWAY_PORT:-8643}:8642"
    healthcheck:
      test:
        - CMD-SHELL
        - "pgrep -f 'hermes gateway run' >/dev/null"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${HERMES_OWASHOTA_MEMORY_LIMIT:-2g}
    cpus: ${HERMES_OWASHOTA_CPU_LIMIT:-1}
    shm_size: ${HERMES_OWASHOTA_SHM_SIZE:-512m}

  open-llm-vtuber:
    image: ${OLLV_IMAGE:-openllmvtuber/open-llm-vtuber@sha256:98170895ae3bffcd7467209af93766e475ca43efc3fab0bf8232cda93c8560c8}
    container_name: open-llm-vtuber
    restart: unless-stopped
    networks:
      - hermes-net
    volumes:
      - type: bind
        source: ${OLLV_CONFIG_DIR:-./config/open-llm-vtuber}
        target: /app/conf
      - type: bind
        source: ${OLLV_MODELS_DIR:-./runtime/ollv-models}
        target: /app/models
    ports:
      - "${OLLV_PORT:-12393}:12393"
    environment:
      - TZ=Asia/Tokyo

  searxng:
    image: docker.io/searxng/searxng@sha256:201c62d470abf1b3ccad42562b6a8310267fbb022962d8bd410c4b011ec4516e
    container_name: searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND:-127.0.0.1}:${SEARXNG_PORT:-8080}:8080"
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080/}
    volumes:
      - type: bind
        source: ${SEARXNG_CONFIG_DIR:-./config/searxng}
        target: /etc/searxng
        read_only: true
    networks:
      - hermes-net
    depends_on:
      - redis
    mem_limit: ${SEARXNG_MEMORY_LIMIT:-512m}
    cpus: ${SEARXNG_CPU_LIMIT:-0.5}

  redis:
    image: docker.io/valkey/valkey:8-alpine@sha256:b027235326507cfdade9b6684056ec1d0b0c0757412e628245129b5d7b788618
    container_name: searxng-redis
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - type: volume
        source: searxng_redis_data
        target: /data
    networks:
      - hermes-net
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}

networks:
  hermes-net:
    driver: bridge
  local-observability-net:
    external: true
    name: local-observability-net

volumes:
  searxng_redis_data:
