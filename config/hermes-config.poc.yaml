# Non-secret Hermes settings for the backup-secretary PoC.
# Copy selected values into runtime/hermes-data/config.yaml after `docker compose --profile setup run --rm setup`.

model:
  model: gpt-5.6-sol
  default: gpt-5.6-sol
  provider: openai-codex

agent:
  reasoning_effort: medium

auxiliary:
  web_extract:
    provider: opencode-go
    model: deepseek-v4-flash
  compression:
    provider: opencode-go
    model: deepseek-v4-flash
  session_search:
    provider: opencode-go
    model: deepseek-v4-flash
  skills_hub:
    provider: opencode-go
    model: deepseek-v4-flash
  approval:
    provider: opencode-go
    model: deepseek-v4-flash
  mcp:
    provider: opencode-go
    model: deepseek-v4-flash
  title_generation:
    provider: opencode-go
    model: deepseek-v4-flash
  curator:
    provider: opencode-go
    model: deepseek-v4-flash

terminal:
  # Hermes itself already runs inside the hardened Compose container.
  # Do not mount /var/run/docker.sock for this PoC; it would grant host-level Docker control.
  backend: local
  cwd: /workspace
  timeout: 180
  env_passthrough: []

approvals:
  mode: manual
  timeout: 60

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000

security:
  website_blocklist:
    enabled: true
    domains:
      - "169.254.169.254"
      - "localhost"
      - "127.0.0.1"
      - "*.local"
    shared_files: []

